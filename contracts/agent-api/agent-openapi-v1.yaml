openapi: 3.1.0
info:
  title: AIResearcher Agent API
  version: 1.0.0
  description: >-
    Python Agent 向 Java BFF 暴露的本地论文原件库与 RAG API。Java 是唯一调用方；
    原件、论文、任务、检索和模型运行数据均由 Python Agent 管理。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Agent 服务根地址
externalDocs:
  description: SSE v1 线协议与生命周期规则
  url: ../sse/v1/README.md
tags:
  - name: Library
  - name: Papers
  - name: Ingestion jobs
  - name: Conversations
paths:
  /agent-api/v1/library:
    get:
      tags: [Library]
      operationId: getAgentLibrary
      summary: 获取本地论文原件库状态
      parameters:
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/library/files:
    get:
      tags: [Library]
      operationId: listAgentLibraryFiles
      summary: 分页列出论文原件及其知识库对应状态
      description: >-
        原件清单独立于知识库论文。不传 libraryState 时返回全部；ORIGINAL_MISSING 仅返回
        已关联 Paper 且 sourceStatus 为 MISSING 或 REPLACED 的记录；NOT_INGESTED 仅返回
        sourceStatus=AVAILABLE 但当前不可检索的记录，包括未创建 Paper、入库中（PROCESSING）、
        失败（FAILED）和兼容性 EXCLUDED；INGESTED 仅返回 sourceStatus=AVAILABLE、Paper 为 READY 且 searchable=true
        的记录。筛选必须同时作用于 items 和 total，再执行分页。
      parameters:
        - $ref: '#/components/parameters/LibraryFilesOffset'
        - $ref: '#/components/parameters/LibraryFilesLimit'
        - $ref: '#/components/parameters/LibraryStateFilter'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryFilesResponse'
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
    post:
      tags: [Library]
      operationId: uploadAgentLibraryFile
      summary: 上传一篇 PDF 原件但不创建入库任务
      description: >-
        multipart 请求必须且只能包含一个名为 file 的 PDF，文件名必须以 .pdf 结尾，最大
        50 MB。file part 的 MIME 可以是 application/pdf、application/octet-stream 或不提供；
        Agent 最终仍按大小和 %PDF- 签名校验。文件完成安全校验、SHA-256 去重和原子落盘后
        仅登记为原件；客户端必须另行调用 ingestion 接口才会解析和建库。
      parameters:
        - $ref: '#/components/parameters/RequiredRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    单个 .pdf 原件；允许 application/pdf、application/octet-stream 或未提供 MIME，
                    最终仍校验 50 MB 上限和 %PDF- 签名。
      responses:
        '200':
          $ref: '#/components/responses/LibraryFileUploadResponse'
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '413':
          $ref: '#/components/responses/AgentErrorResponse'
        '415':
          $ref: '#/components/responses/AgentErrorResponse'
        '422':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/library/files/{libraryFileId}/file:
    get:
      tags: [Library]
      operationId: getAgentLibraryFile
      summary: 预览或按 Range 读取已登记 PDF 原件
      parameters:
        - $ref: '#/components/parameters/LibraryFileId'
        - $ref: '#/components/parameters/RequiredRequestId'
        - $ref: '#/components/parameters/OptionalRange'
      responses:
        '200':
          $ref: '#/components/responses/PdfFile'
        '206':
          $ref: '#/components/responses/PdfPartialFile'
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '409':
          $ref: '#/components/responses/AgentErrorResponse'
        '416':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/library/files/{libraryFileId}/ingestion:
    post:
      tags: [Library]
      operationId: ingestAgentLibraryFile
      summary: 手动将一篇可用原件录入知识库
      description: >-
        创建 Paper 和后台入库任务；相同 SHA-256 已有 Paper 时复用既有论文和任务。
        MISSING 或 REPLACED 原件返回冲突，扫描和上传本身绝不调用此操作。
      parameters:
        - $ref: '#/components/parameters/LibraryFileId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryFileIngestionResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '409':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/library/scans:
    post:
      tags: [Library]
      operationId: createAgentLibraryScan
      summary: 创建一次后台原件库扫描
      description: >-
        同时只允许一个 QUEUED 或 RUNNING 的扫描任务。扫描只登记和核对原件，
        不创建 Paper、入库任务、chunk 或向量。
      parameters:
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '202':
          description: 扫描任务已排队。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryScan'
              example:
                scanId: scan-demo-001
                status: QUEUED
                discoveredCount: 0
                registeredCount: 0
                unchangedCount: 0
                duplicateCount: 0
                excludedCount: 0
                skippedCount: 0
                failedCount: 0
                createdAt: '2026-08-29T00:00:00Z'
                startedAt: null
                completedAt: null
                failure: null
        '409':
          description: 已有活动扫描；错误 code 固定为 LIBRARY_SCAN_ACTIVE。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentApiError'
              example:
                schemaVersion: '1.0'
                code: LIBRARY_SCAN_ACTIVE
                message: 原件库扫描正在进行。
                requestId: req-library-scan-001
                retryable: true
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/library/scans/{scanId}:
    get:
      tags: [Library]
      operationId: getAgentLibraryScan
      summary: 获取原件库扫描任务
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryScanResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/library/scans/{scanId}/items:
    get:
      tags: [Library]
      operationId: listAgentLibraryScanItems
      summary: 分页获取扫描文件结果
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/ScanItemsOffset'
        - $ref: '#/components/parameters/ScanItemsLimit'
        - $ref: '#/components/parameters/ScanItemOutcomeFilter'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryScanItemsResponse'
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/papers:
    post:
      tags: [Papers]
      operationId: uploadAgentPaper
      summary: 上传一篇文本型 PDF 并创建入库任务
      deprecated: true
      description: >-
        兼容性入口；新客户端应依次调用 library/files 上传原件和 ingestion 手动入库。
        multipart 请求必须且只能包含一个名为 file 的 PDF，文件名必须以 .pdf 结尾，最大
        50 MB、500 页；file part 的 MIME 可以是 application/pdf、application/octet-stream
        或不提供，最终仍按大小和 %PDF- 签名校验。
        相同 SHA-256 返回原论文和任务并将 duplicate 置为 true，不创建第二份文件或向量。
      parameters:
        - $ref: '#/components/parameters/RequiredRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    单个 .pdf 文件；允许 application/pdf、application/octet-stream 或未提供 MIME，
                    最终仍校验大小和 %PDF- 签名。
      responses:
        '200':
          description: 已接收新论文，或返回 SHA-256 相同的既有论文。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperUploadResponse'
              example:
                paper:
                  paperId: paper-demo-001
                  title: Synthetic Bilingual Research
                  authors: [Demo Author]
                  publicationYear: 2026
                  fileName: synthetic-demo.pdf
                  fileSizeBytes: 4096
                  libraryRelativePath: synthetic-demo.pdf
                  sourceStatus: AVAILABLE
                  status: PROCESSING
                  searchable: false
                  pageCount: null
                  createdAt: '2026-01-01T00:00:00Z'
                  updatedAt: '2026-01-01T00:00:00Z'
                  currentIngestion:
                    jobId: job-demo-001
                    status: QUEUED
                    stage: QUEUED
                    attempt: 0
                    maxAttempts: 3
                    canRetry: false
                    failure: null
                ingestionJob:
                  jobId: job-demo-001
                  paperId: paper-demo-001
                  status: QUEUED
                  stage: QUEUED
                  attempt: 0
                  maxAttempts: 3
                  canRetry: false
                  failure: null
                  createdAt: '2026-01-01T00:00:00Z'
                  startedAt: null
                  completedAt: null
                duplicate: false
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '413':
          $ref: '#/components/responses/AgentErrorResponse'
        '415':
          $ref: '#/components/responses/AgentErrorResponse'
        '422':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
    get:
      tags: [Papers]
      operationId: listAgentPapers
      summary: 列出默认知识库中的论文
      parameters:
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          description: 论文列表，按创建时间倒序。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperListResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/papers/{paperId}:
    get:
      tags: [Papers]
      operationId: getAgentPaper
      summary: 获取论文详情
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PaperResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
    delete:
      tags: [Papers]
      operationId: deleteAgentPaperKnowledge
      summary: 删除论文知识但保留仍存在的 PDF 原件
      description: >-
        先阻止论文继续检索，再删除该 Paper 的 Qdrant 向量，最后删除 Paper、入库任务和 chunk。
        不得删除、移动或清理任何仍存在的 PDF 原件；AVAILABLE 原件解除 Paper 关联后成为未入库，
        MISSING 或 REPLACED 且不再关联知识的陈旧登记可以清理。论文不存在返回 404
        PAPER_NOT_FOUND；存在 QUEUED 或 RUNNING 入库任务返回 409 PAPER_BUSY 且 retryable=true；
        Qdrant 或数据库不可用分别返回 503 QDRANT_UNAVAILABLE 或 DATABASE_UNAVAILABLE，
        retryable=true，原件不受影响；其他内部失败返回 500。
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/DeletePaperKnowledgeResponse'
        '404':
          $ref: '#/components/responses/DeletePaperNotFoundErrorResponse'
        '409':
          $ref: '#/components/responses/DeletePaperBusyErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/DeletePaperDependencyErrorResponse'
  /agent-api/v1/papers/{paperId}/exclusion:
    post:
      tags: [Papers]
      operationId: excludeAgentPaper
      summary: 将论文移出知识库但保留原件
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PaperResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '409':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
    delete:
      tags: [Papers]
      operationId: restoreAgentPaper
      summary: 重新加入原件可用的已排除论文
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PaperResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '409':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/papers/{paperId}/file:
    get:
      tags: [Papers]
      operationId: getAgentPaperFile
      summary: 下载或按 Range 读取原始 PDF
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
        - $ref: '#/components/parameters/OptionalRange'
      responses:
        '200':
          $ref: '#/components/responses/PdfFile'
        '206':
          $ref: '#/components/responses/PdfPartialFile'
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '416':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/ingestion-jobs/{jobId}:
    get:
      tags: [Ingestion jobs]
      operationId: getAgentIngestionJob
      summary: 获取入库任务状态和阶段
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/IngestionJobResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/ingestion-jobs/{jobId}/retry:
    post:
      tags: [Ingestion jobs]
      operationId: retryAgentIngestionJob
      summary: 重试一个可重试的失败任务
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/IngestionJobResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '409':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/conversations/{conversationId}/messages/stream:
    post:
      tags: [Conversations]
      operationId: streamAgentConversationMessage
      summary: 使用原生 Tool Calling 流式生成助手消息
      description: >-
        Java 必须传入有效 X-Request-Id。HTTP 200 表示流已建立；建流前非 2xx
        使用 StreamOpenError。建流后的失败只能由唯一 run.failed 终止事件表达。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/RequiredRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStreamRequest'
            examples:
              defaultKnowledgeBase:
                value:
                  content: 论文中的核心实验结论是什么？
                  paperIds: []
              selectedPaper:
                value:
                  content: 第二页报告了什么结果？
                  paperIds: [paper-demo-001]
      responses:
        '200':
          $ref: '#/components/responses/SseStream'
        '400':
          $ref: '#/components/responses/BadStreamRequest'
        '500':
          $ref: '#/components/responses/InternalStreamError'
        '503':
          $ref: '#/components/responses/StreamServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedStreamOpenError'
      x-sse-event-schema:
        $ref: '#/components/schemas/SseEvent'
      x-sse-contract: ../sse/v1/README.md
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PaperId:
      name: paperId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    LibraryFileId:
      name: libraryFileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ScanItemsOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ScanItemsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    ScanItemOutcomeFilter:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LibraryScanItemOutcome'
    LibraryFilesOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    LibraryFilesLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    LibraryStateFilter:
      name: libraryState
      in: query
      required: false
      description: 不传表示全部；枚举语义由 LibraryStateFilter Schema 固定。
      schema:
        $ref: '#/components/schemas/LibraryStateFilter'
      examples:
        originalMissing:
          value: ORIGINAL_MISSING
        notIngested:
          value: NOT_INGESTED
        ingested:
          value: INGESTED
    RequiredRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Java 接收或生成并原样转发的请求追踪标识。
      schema:
        $ref: '#/components/schemas/Identifier'
    OptionalRange:
      name: Range
      in: header
      required: false
      description: 单一 HTTP bytes range；不支持 multipart ranges。
      schema:
        type: string
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
        example: bytes=0-1023
  headers:
    XRequestId:
      description: 本次请求的有效请求追踪标识。
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    CacheControl:
      description: SSE 响应不得缓存。
      required: true
      schema:
        type: string
        const: no-cache
    AcceptRanges:
      description: PDF 支持 bytes Range。
      required: true
      schema:
        type: string
        const: bytes
    ContentLength:
      description: 当前响应体字节数。
      required: true
      schema:
        type: integer
        minimum: 0
    ContentRange:
      description: 206 响应覆盖的字节范围和完整文件大小。
      required: true
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    ETag:
      description: 基于 PDF SHA-256 的强 ETag。
      required: true
      schema:
        type: string
        minLength: 3
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
    PaperStatus:
      type: string
      enum: [PROCESSING, READY, FAILED, EXCLUDED]
    PaperSourceStatus:
      type: string
      enum: [AVAILABLE, MISSING, REPLACED]
    LibraryFileKnowledgeStatus:
      type: string
      description: 原件与默认知识库的对应状态；扫描和原件上传只能产生 NOT_INGESTED。
      enum: [NOT_INGESTED, PROCESSING, READY, FAILED, EXCLUDED]
    LibraryStateFilter:
      type: string
      description: >-
        原件库服务端筛选：ORIGINAL_MISSING 表示已关联 Paper 且原件为 MISSING 或 REPLACED；
        NOT_INGESTED 表示原件 AVAILABLE 但当前不可检索，包含无 Paper、入库中、失败和
        兼容性 EXCLUDED；INGESTED 表示原件 AVAILABLE、Paper 为 READY 且 searchable=true。
      enum: [ORIGINAL_MISSING, NOT_INGESTED, INGESTED]
    LibraryScanStatus:
      type: string
      description: 单个文件失败时任务仍可 SUCCEEDED，并通过 failedCount 和扫描项报告部分失败。
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
    LibraryScanItemOutcome:
      type: string
      description: 每个被发现路径的独立处理结果；REGISTERED 只表示新增 LibraryFile，不表示入库。
      enum: [REGISTERED, UNCHANGED, MOVED, DUPLICATE, EXCLUDED, SKIPPED, FAILED]
    IngestionJobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
    IngestionStage:
      type: string
      enum: [QUEUED, PARSING, CHUNKING, EMBEDDING, INDEXING, COMPLETED, FAILED]
    IngestionFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        retryable:
          type: boolean
    IngestionSummary:
      type: object
      additionalProperties: false
      required: [jobId, status, stage, attempt, maxAttempts, canRetry, failure]
      properties:
        jobId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/IngestionJobStatus'
        stage:
          $ref: '#/components/schemas/IngestionStage'
        attempt:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        canRetry:
          type: boolean
        failure:
          oneOf:
            - $ref: '#/components/schemas/IngestionFailure'
            - type: 'null'
    Paper:
      type: object
      additionalProperties: false
      required:
        - paperId
        - title
        - authors
        - publicationYear
        - fileName
        - fileSizeBytes
        - libraryRelativePath
        - sourceStatus
        - status
        - searchable
        - pageCount
        - createdAt
        - updatedAt
        - currentIngestion
      properties:
        paperId:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 1024
        authors:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        publicationYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 9999
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 52428800
        libraryRelativePath:
          type: string
          minLength: 1
          maxLength: 2048
          description: 相对 originals 目录的正斜杠路径；不得是绝对路径或包含路径穿越。
        sourceStatus:
          $ref: '#/components/schemas/PaperSourceStatus'
        status:
          $ref: '#/components/schemas/PaperStatus'
        searchable:
          type: boolean
          description: 仅 READY 且 AVAILABLE 且未排除时为 true。
        pageCount:
          type: [integer, 'null']
          minimum: 1
          maximum: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentIngestion:
          $ref: '#/components/schemas/IngestionSummary'
    IngestionJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - paperId
        - status
        - stage
        - attempt
        - maxAttempts
        - canRetry
        - failure
        - createdAt
        - startedAt
        - completedAt
      properties:
        jobId:
          $ref: '#/components/schemas/Identifier'
        paperId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/IngestionJobStatus'
        stage:
          $ref: '#/components/schemas/IngestionStage'
        attempt:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        canRetry:
          type: boolean
        failure:
          oneOf:
            - $ref: '#/components/schemas/IngestionFailure'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    PaperUploadResponse:
      type: object
      additionalProperties: false
      required: [paper, ingestionJob, duplicate]
      properties:
        paper:
          $ref: '#/components/schemas/Paper'
        ingestionJob:
          $ref: '#/components/schemas/IngestionJob'
        duplicate:
          type: boolean
    PaperListResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Paper'
        total:
          type: integer
          minimum: 0
    DeletePaperResponse:
      type: object
      additionalProperties: false
      required: [paperId, deleted]
      properties:
        paperId:
          $ref: '#/components/schemas/Identifier'
        deleted:
          type: boolean
          const: true
          description: true 表示论文知识、任务、chunk 和向量已删除；不表示 PDF 原件被删除。
    LibraryFile:
      type: object
      additionalProperties: false
      required:
        - libraryFileId
        - relativePath
        - fileName
        - fileSizeBytes
        - sha256
        - sourceStatus
        - knowledgeStatus
        - paperId
        - paperTitle
        - searchable
        - currentIngestion
        - discoveredAt
        - lastSeenAt
        - updatedAt
      properties:
        libraryFileId:
          $ref: '#/components/schemas/Identifier'
        relativePath:
          type: string
          minLength: 1
          maxLength: 2048
          description: 相对 originals 目录的正斜杠路径；不得是绝对路径或包含路径穿越。
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 52428800
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sourceStatus:
          $ref: '#/components/schemas/PaperSourceStatus'
        knowledgeStatus:
          $ref: '#/components/schemas/LibraryFileKnowledgeStatus'
        paperId:
          description: NOT_INGESTED 时必须为 null；其余知识库状态必须关联 Paper。
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        paperTitle:
          type: [string, 'null']
          minLength: 1
          maxLength: 1024
        searchable:
          type: boolean
          description: 仅 knowledgeStatus=READY 且 sourceStatus=AVAILABLE 时为 true。
        currentIngestion:
          description: NOT_INGESTED 时必须为 null；关联 Paper 后返回其当前入库任务摘要。
          oneOf:
            - $ref: '#/components/schemas/IngestionSummary'
            - type: 'null'
        discoveredAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LibraryFilesPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryFile'
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
    LibraryFileUploadResponse:
      type: object
      additionalProperties: false
      required: [libraryFile, duplicate]
      properties:
        libraryFile:
          $ref: '#/components/schemas/LibraryFile'
        duplicate:
          type: boolean
          description: true 表示相同 SHA-256 原件已经登记，未重复落盘。
    LibraryFileIngestionResponse:
      type: object
      additionalProperties: false
      required: [libraryFile, paper, ingestionJob, duplicate]
      properties:
        libraryFile:
          $ref: '#/components/schemas/LibraryFile'
        paper:
          $ref: '#/components/schemas/Paper'
        ingestionJob:
          $ref: '#/components/schemas/IngestionJob'
        duplicate:
          type: boolean
          description: true 表示相同 SHA-256 已有关联 Paper，未创建第二篇论文或向量。
    LibraryScanFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
    LibraryScan:
      type: object
      additionalProperties: false
      required:
        - scanId
        - status
        - discoveredCount
        - registeredCount
        - unchangedCount
        - duplicateCount
        - excludedCount
        - skippedCount
        - failedCount
        - createdAt
        - startedAt
        - completedAt
        - failure
      properties:
        scanId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/LibraryScanStatus'
        discoveredCount: { type: integer, minimum: 0 }
        registeredCount:
          type: integer
          minimum: 0
          description: 本次新增登记的原件数量；登记原件不会自动创建 Paper、入库任务或向量。
        unchangedCount: { type: integer, minimum: 0 }
        duplicateCount: { type: integer, minimum: 0 }
        excludedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        failure:
          oneOf:
            - $ref: '#/components/schemas/LibraryScanFailure'
            - type: 'null'
    LibraryInfo:
      type: object
      additionalProperties: false
      required: [rootPath, originalsPath, supportedExtensions, scanInProgress, latestScan]
      properties:
        rootPath:
          type: string
          minLength: 1
          description: Agent 解析后的本机原件库根目录绝对路径。
        originalsPath:
          type: string
          minLength: 1
          description: 扫描器实际递归遍历、供本机用户直接存放 PDF 的 originals 目录绝对路径。
        supportedExtensions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ['.pdf']
        scanInProgress:
          type: boolean
        latestScan:
          oneOf:
            - $ref: '#/components/schemas/LibraryScan'
            - type: 'null'
    LibraryScanItem:
      type: object
      additionalProperties: false
      required: [relativePath, outcome, libraryFileId, paperId, code, message]
      properties:
        relativePath:
          type: string
          minLength: 1
          maxLength: 2048
        outcome:
          $ref: '#/components/schemas/LibraryScanItemOutcome'
        libraryFileId:
          description: 成功对应到原件记录时返回；SKIPPED 或无法登记的 FAILED 项可以为 null。
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        paperId:
          description: 原件尚未手动录入知识库时为 null；扫描本身不得创建 Paper。
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        code:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        message:
          type: [string, 'null']
          minLength: 1
          maxLength: 2048
    LibraryScanItemsPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryScanItem'
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
    AgentApiError:
      type: object
      additionalProperties: false
      required: [schemaVersion, code, message, requestId, retryable]
      properties:
        schemaVersion:
          const: '1.0'
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        requestId:
          $ref: '#/components/schemas/Identifier'
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason]
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 256
              reason:
                type: string
                minLength: 1
                maxLength: 1024
    ChatStreamRequest:
      type: object
      additionalProperties: false
      required: [content, paperIds]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 16000
        paperIds:
          type: array
          uniqueItems: true
          maxItems: 100
          description: 空数组表示检索默认全库；非空数组严格限定到给定论文。
          items:
            $ref: '#/components/schemas/Identifier'
    SseEvent:
      $ref: ../sse/v1/sse-event.schema.json
    StreamOpenError:
      $ref: ../sse/v1/stream-open-error.schema.json
  responses:
    LibraryResponse:
      description: 本地论文原件库状态。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryInfo'
          example:
            rootPath: 'D:/AIResearcher/.private/paper-library'
            originalsPath: 'D:/AIResearcher/.private/paper-library/originals'
            supportedExtensions: ['.pdf']
            scanInProgress: false
            latestScan: null
    LibraryFilesResponse:
      description: 分页原件与知识库对应状态。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryFilesPage'
          example:
            items:
              - libraryFileId: library-file-demo-001
                relativePath: uploads/synthetic-demo.pdf
                fileName: synthetic-demo.pdf
                fileSizeBytes: 4096
                sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                sourceStatus: AVAILABLE
                knowledgeStatus: NOT_INGESTED
                paperId: null
                paperTitle: null
                searchable: false
                currentIngestion: null
                discoveredAt: '2026-08-29T00:00:00Z'
                lastSeenAt: '2026-08-29T00:00:00Z'
                updatedAt: '2026-08-29T00:00:00Z'
            total: 1
            offset: 0
            limit: 100
    LibraryFileUploadResponse:
      description: PDF 原件已登记，但未创建 Paper 或入库任务。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryFileUploadResponse'
          example:
            libraryFile:
              libraryFileId: library-file-demo-001
              relativePath: uploads/synthetic-demo.pdf
              fileName: synthetic-demo.pdf
              fileSizeBytes: 4096
              sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              sourceStatus: AVAILABLE
              knowledgeStatus: NOT_INGESTED
              paperId: null
              paperTitle: null
              searchable: false
              currentIngestion: null
              discoveredAt: '2026-08-29T00:00:00Z'
              lastSeenAt: '2026-08-29T00:00:00Z'
              updatedAt: '2026-08-29T00:00:00Z'
            duplicate: false
    LibraryFileIngestionResponse:
      description: 原件已关联 Paper，并返回当前入库任务。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryFileIngestionResponse'
    LibraryScanResponse:
      description: 原件库扫描任务详情。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryScan'
    LibraryScanItemsResponse:
      description: 分页扫描文件结果。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryScanItemsPage'
          example:
            items:
              - relativePath: topic/synthetic-demo.pdf
                outcome: REGISTERED
                libraryFileId: library-file-demo-001
                paperId: null
                code: null
                message: null
            total: 1
            offset: 0
            limit: 100
    PaperResponse:
      description: 论文详情。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paper'
    DeletePaperKnowledgeResponse:
      description: 论文知识已删除；所有仍存在的 PDF 原件均保留。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeletePaperResponse'
          example:
            paperId: paper-demo-001
            deleted: true
    IngestionJobResponse:
      description: 入库任务详情。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestionJob'
    AgentErrorResponse:
      description: Agent REST 错误；Java 必须映射为稳定 Web Result 错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentApiError'
          example:
            schemaVersion: '1.0'
            code: PAPER_NOT_FOUND
            message: 未找到指定论文。
            requestId: req-demo-error-001
            retryable: false
    DeletePaperNotFoundErrorResponse:
      description: 论文不存在；code 固定为 PAPER_NOT_FOUND。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentApiError'
          example:
            schemaVersion: '1.0'
            code: PAPER_NOT_FOUND
            message: 未找到指定论文。
            requestId: req-delete-paper-001
            retryable: false
    DeletePaperBusyErrorResponse:
      description: 论文存在 QUEUED 或 RUNNING 入库任务；code 固定为 PAPER_BUSY。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentApiError'
          example:
            schemaVersion: '1.0'
            code: PAPER_BUSY
            message: 论文正在入库，请稍后再操作。
            requestId: req-delete-paper-001
            retryable: true
    DeletePaperDependencyErrorResponse:
      description: Qdrant 或数据库不可用；论文保持不可检索，原件不受影响，可以重试删除。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentApiError'
          examples:
            qdrantUnavailable:
              value:
                schemaVersion: '1.0'
                code: QDRANT_UNAVAILABLE
                message: 向量服务暂时不可用；论文已停止检索，但清理尚未完成。
                requestId: req-delete-paper-001
                retryable: true
            databaseUnavailable:
              value:
                schemaVersion: '1.0'
                code: DATABASE_UNAVAILABLE
                message: 论文数据库暂时不可用。
                requestId: req-delete-paper-001
                retryable: true
    PdfFile:
      description: 完整 PDF；不使用 JSON 包装。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    PdfPartialFile:
      description: 单一 Range 的 PDF 字节片段；不使用 JSON 包装。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Range:
          $ref: '#/components/headers/ContentRange'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    SseStream:
      description: >-
        SSE v1 流；事件名、ID、JSON envelope 和终止行为遵循共享契约，不使用
        Result 包装，也不发送隐藏推理。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/event-stream:
          schema:
            type: string
          examples:
            completed:
              externalValue: ../sse/v1/examples/streams/run-completed.sse
            failed:
              externalValue: ../sse/v1/examples/streams/run-failed.sse
    BadStreamRequest:
      description: 请求无效，流尚未建立。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
          examples:
            invalidRequest:
              externalValue: ../sse/v1/examples/stream-open-error.json
    InternalStreamError:
      description: Agent 建流前内部错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
    StreamServiceUnavailable:
      description: Agent 或模型提供方在建流前不可用。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
    UnexpectedStreamOpenError:
      description: 其他建流前非 2xx 错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
