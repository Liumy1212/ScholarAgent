openapi: 3.1.0
info:
  title: AIResearcher Agent API
  version: 1.0.0
  description: >-
    Python Agent 向 Java BFF 暴露的单篇论文 Demo API。Java 是唯一调用方；
    论文、任务、文件、检索和模型运行数据均由 Python Agent 管理。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Agent 服务根地址
externalDocs:
  description: SSE v1 线协议与生命周期规则
  url: ../sse/v1/README.md
tags:
  - name: Papers
  - name: Ingestion jobs
  - name: Conversations
paths:
  /agent-api/v1/papers:
    post:
      tags: [Papers]
      operationId: uploadAgentPaper
      summary: 上传一篇文本型 PDF 并创建入库任务
      description: >-
        multipart 请求必须且只能包含一个名为 file 的 PDF，最大 50 MB、500 页。
        相同 SHA-256 返回原论文和任务并将 duplicate 置为 true，不创建第二份文件或向量。
      parameters:
        - $ref: '#/components/parameters/RequiredRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 单个 application/pdf 文件。
      responses:
        '200':
          description: 已接收新论文，或返回 SHA-256 相同的既有论文。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperUploadResponse'
              example:
                paper:
                  paperId: paper-demo-001
                  title: Synthetic Bilingual Research
                  authors: [Demo Author]
                  publicationYear: 2026
                  fileName: synthetic-demo.pdf
                  fileSizeBytes: 4096
                  status: PROCESSING
                  pageCount: null
                  createdAt: '2026-01-01T00:00:00Z'
                  updatedAt: '2026-01-01T00:00:00Z'
                  currentIngestion:
                    jobId: job-demo-001
                    status: QUEUED
                    stage: QUEUED
                    attempt: 0
                    maxAttempts: 3
                    canRetry: false
                    failure: null
                ingestionJob:
                  jobId: job-demo-001
                  paperId: paper-demo-001
                  status: QUEUED
                  stage: QUEUED
                  attempt: 0
                  maxAttempts: 3
                  canRetry: false
                  failure: null
                  createdAt: '2026-01-01T00:00:00Z'
                  startedAt: null
                  completedAt: null
                duplicate: false
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '413':
          $ref: '#/components/responses/AgentErrorResponse'
        '415':
          $ref: '#/components/responses/AgentErrorResponse'
        '422':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
    get:
      tags: [Papers]
      operationId: listAgentPapers
      summary: 列出默认知识库中的论文
      parameters:
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          description: 论文列表，按创建时间倒序。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperListResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/papers/{paperId}:
    get:
      tags: [Papers]
      operationId: getAgentPaper
      summary: 获取论文详情
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PaperResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
    delete:
      tags: [Papers]
      operationId: deleteAgentPaper
      summary: 删除论文、当前文件、chunk 与向量
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          description: 删除完成。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePaperResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '409':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/papers/{paperId}/file:
    get:
      tags: [Papers]
      operationId: getAgentPaperFile
      summary: 下载或按 Range 读取原始 PDF
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/RequiredRequestId'
        - $ref: '#/components/parameters/OptionalRange'
      responses:
        '200':
          $ref: '#/components/responses/PdfFile'
        '206':
          $ref: '#/components/responses/PdfPartialFile'
        '400':
          $ref: '#/components/responses/AgentErrorResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '416':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/ingestion-jobs/{jobId}:
    get:
      tags: [Ingestion jobs]
      operationId: getAgentIngestionJob
      summary: 获取入库任务状态和阶段
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/IngestionJobResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/ingestion-jobs/{jobId}/retry:
    post:
      tags: [Ingestion jobs]
      operationId: retryAgentIngestionJob
      summary: 重试一个可重试的失败任务
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/RequiredRequestId'
      responses:
        '200':
          $ref: '#/components/responses/IngestionJobResponse'
        '404':
          $ref: '#/components/responses/AgentErrorResponse'
        '409':
          $ref: '#/components/responses/AgentErrorResponse'
        '500':
          $ref: '#/components/responses/AgentErrorResponse'
        '503':
          $ref: '#/components/responses/AgentErrorResponse'
  /agent-api/v1/conversations/{conversationId}/messages/stream:
    post:
      tags: [Conversations]
      operationId: streamAgentConversationMessage
      summary: 使用原生 Tool Calling 流式生成助手消息
      description: >-
        Java 必须传入有效 X-Request-Id。HTTP 200 表示流已建立；建流前非 2xx
        使用 StreamOpenError。建流后的失败只能由唯一 run.failed 终止事件表达。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/RequiredRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStreamRequest'
            examples:
              defaultKnowledgeBase:
                value:
                  content: 论文中的核心实验结论是什么？
                  paperIds: []
              selectedPaper:
                value:
                  content: 第二页报告了什么结果？
                  paperIds: [paper-demo-001]
      responses:
        '200':
          $ref: '#/components/responses/SseStream'
        '400':
          $ref: '#/components/responses/BadStreamRequest'
        '500':
          $ref: '#/components/responses/InternalStreamError'
        '503':
          $ref: '#/components/responses/StreamServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedStreamOpenError'
      x-sse-event-schema:
        $ref: '#/components/schemas/SseEvent'
      x-sse-contract: ../sse/v1/README.md
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PaperId:
      name: paperId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    RequiredRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Java 接收或生成并原样转发的请求追踪标识。
      schema:
        $ref: '#/components/schemas/Identifier'
    OptionalRange:
      name: Range
      in: header
      required: false
      description: 单一 HTTP bytes range；不支持 multipart ranges。
      schema:
        type: string
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
        example: bytes=0-1023
  headers:
    XRequestId:
      description: 本次请求的有效请求追踪标识。
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    CacheControl:
      description: SSE 响应不得缓存。
      required: true
      schema:
        type: string
        const: no-cache
    AcceptRanges:
      description: PDF 支持 bytes Range。
      required: true
      schema:
        type: string
        const: bytes
    ContentLength:
      description: 当前响应体字节数。
      required: true
      schema:
        type: integer
        minimum: 0
    ContentRange:
      description: 206 响应覆盖的字节范围和完整文件大小。
      required: true
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    ETag:
      description: 基于 PDF SHA-256 的强 ETag。
      required: true
      schema:
        type: string
        minLength: 3
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
    PaperStatus:
      type: string
      enum: [PROCESSING, READY, FAILED]
    IngestionJobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
    IngestionStage:
      type: string
      enum: [QUEUED, PARSING, CHUNKING, EMBEDDING, INDEXING, COMPLETED, FAILED]
    IngestionFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        retryable:
          type: boolean
    IngestionSummary:
      type: object
      additionalProperties: false
      required: [jobId, status, stage, attempt, maxAttempts, canRetry, failure]
      properties:
        jobId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/IngestionJobStatus'
        stage:
          $ref: '#/components/schemas/IngestionStage'
        attempt:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        canRetry:
          type: boolean
        failure:
          oneOf:
            - $ref: '#/components/schemas/IngestionFailure'
            - type: 'null'
    Paper:
      type: object
      additionalProperties: false
      required:
        - paperId
        - title
        - authors
        - publicationYear
        - fileName
        - fileSizeBytes
        - status
        - pageCount
        - createdAt
        - updatedAt
        - currentIngestion
      properties:
        paperId:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 1024
        authors:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        publicationYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 9999
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 52428800
        status:
          $ref: '#/components/schemas/PaperStatus'
        pageCount:
          type: [integer, 'null']
          minimum: 1
          maximum: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentIngestion:
          $ref: '#/components/schemas/IngestionSummary'
    IngestionJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - paperId
        - status
        - stage
        - attempt
        - maxAttempts
        - canRetry
        - failure
        - createdAt
        - startedAt
        - completedAt
      properties:
        jobId:
          $ref: '#/components/schemas/Identifier'
        paperId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/IngestionJobStatus'
        stage:
          $ref: '#/components/schemas/IngestionStage'
        attempt:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        canRetry:
          type: boolean
        failure:
          oneOf:
            - $ref: '#/components/schemas/IngestionFailure'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    PaperUploadResponse:
      type: object
      additionalProperties: false
      required: [paper, ingestionJob, duplicate]
      properties:
        paper:
          $ref: '#/components/schemas/Paper'
        ingestionJob:
          $ref: '#/components/schemas/IngestionJob'
        duplicate:
          type: boolean
    PaperListResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Paper'
        total:
          type: integer
          minimum: 0
    DeletePaperResponse:
      type: object
      additionalProperties: false
      required: [paperId, deleted]
      properties:
        paperId:
          $ref: '#/components/schemas/Identifier'
        deleted:
          const: true
    AgentApiError:
      type: object
      additionalProperties: false
      required: [schemaVersion, code, message, requestId, retryable]
      properties:
        schemaVersion:
          const: '1.0'
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        requestId:
          $ref: '#/components/schemas/Identifier'
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason]
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 256
              reason:
                type: string
                minLength: 1
                maxLength: 1024
    ChatStreamRequest:
      type: object
      additionalProperties: false
      required: [content, paperIds]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 16000
        paperIds:
          type: array
          uniqueItems: true
          maxItems: 100
          description: 空数组表示检索默认全库；非空数组严格限定到给定论文。
          items:
            $ref: '#/components/schemas/Identifier'
    SseEvent:
      $ref: ../sse/v1/sse-event.schema.json
    StreamOpenError:
      $ref: ../sse/v1/stream-open-error.schema.json
  responses:
    PaperResponse:
      description: 论文详情。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Paper'
    IngestionJobResponse:
      description: 入库任务详情。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestionJob'
    AgentErrorResponse:
      description: Agent REST 错误；Java 必须映射为稳定 Web Result 错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentApiError'
          example:
            schemaVersion: '1.0'
            code: PAPER_NOT_FOUND
            message: 未找到指定论文。
            requestId: req-demo-error-001
            retryable: false
    PdfFile:
      description: 完整 PDF；不使用 JSON 包装。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    PdfPartialFile:
      description: 单一 Range 的 PDF 字节片段；不使用 JSON 包装。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Range:
          $ref: '#/components/headers/ContentRange'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    SseStream:
      description: >-
        SSE v1 流；事件名、ID、JSON envelope 和终止行为遵循共享契约，不使用
        Result 包装，也不发送隐藏推理。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/event-stream:
          schema:
            type: string
          examples:
            completed:
              externalValue: ../sse/v1/examples/streams/run-completed.sse
            failed:
              externalValue: ../sse/v1/examples/streams/run-failed.sse
    BadStreamRequest:
      description: 请求无效，流尚未建立。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
          examples:
            invalidRequest:
              externalValue: ../sse/v1/examples/stream-open-error.json
    InternalStreamError:
      description: Agent 建流前内部错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
    StreamServiceUnavailable:
      description: Agent 或模型提供方在建流前不可用。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
    UnexpectedStreamOpenError:
      description: 其他建流前非 2xx 错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
