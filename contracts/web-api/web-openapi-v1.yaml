openapi: 3.1.0
info:
  title: AIResearcher Web API
  version: 1.0.0
  description: >-
    Java BFF 向 React 暴露的本地论文原件库与 RAG API。React 只调用 /api/v1/**；
    Java 代理 Python Agent，并为普通 JSON API 提供 Result<T>。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Java BFF 根地址
externalDocs:
  description: SSE v1 线协议与生命周期规则
  url: ../sse/v1/README.md
tags:
  - name: Library
  - name: Papers
  - name: Ingestion jobs
  - name: Conversations
paths:
  /api/v1/library:
    get:
      tags: [Library]
      operationId: getWebLibrary
      summary: 获取本地论文原件库状态
      parameters:
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryResultResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/library/files:
    get:
      tags: [Library]
      operationId: listWebLibraryFiles
      summary: 分页列出论文原件及其知识库对应状态
      description: 原件清单独立于知识库论文；NOT_INGESTED 原件尚未创建 Paper 或入库任务。
      parameters:
        - $ref: '#/components/parameters/LibraryFilesOffset'
        - $ref: '#/components/parameters/LibraryFilesLimit'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryFilesResultResponse'
        '400':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
    post:
      tags: [Library]
      operationId: uploadWebLibraryFile
      summary: 上传一篇 PDF 原件但不创建入库任务
      description: >-
        multipart 请求必须且只能包含一个名为 file 的 PDF，最大 50 MB。Java 不保存文件，
        只把请求转发给 Agent；成功后客户端必须另行调用 ingestion 接口才会解析和建库。
      parameters:
        - $ref: '#/components/parameters/OptionalRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/LibraryFileUploadResultResponse'
        '400':
          $ref: '#/components/responses/JsonErrorResponse'
        '413':
          $ref: '#/components/responses/JsonErrorResponse'
        '415':
          $ref: '#/components/responses/JsonErrorResponse'
        '422':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/library/files/{libraryFileId}/file:
    get:
      tags: [Library]
      operationId: getWebLibraryFile
      summary: 预览或按 Range 读取已登记 PDF 原件
      description: Java 必须保持下游 PDF Range 与错误体边界，不使用 Result 包装。
      parameters:
        - $ref: '#/components/parameters/LibraryFileId'
        - $ref: '#/components/parameters/OptionalRequestId'
        - $ref: '#/components/parameters/OptionalRange'
      responses:
        '200':
          $ref: '#/components/responses/PdfFile'
        '206':
          $ref: '#/components/responses/PdfPartialFile'
        '400':
          $ref: '#/components/responses/FileErrorResponse'
        '404':
          $ref: '#/components/responses/FileErrorResponse'
        '409':
          $ref: '#/components/responses/FileErrorResponse'
        '416':
          $ref: '#/components/responses/FileErrorResponse'
        '500':
          $ref: '#/components/responses/FileErrorResponse'
        '502':
          $ref: '#/components/responses/FileErrorResponse'
        '504':
          $ref: '#/components/responses/FileErrorResponse'
  /api/v1/library/files/{libraryFileId}/ingestion:
    post:
      tags: [Library]
      operationId: ingestWebLibraryFile
      summary: 手动将一篇可用原件录入知识库
      description: >-
        创建 Paper 和后台入库任务；相同 SHA-256 已有 Paper 时复用既有论文和任务。
        MISSING 或 REPLACED 原件返回冲突，扫描和上传本身绝不调用此操作。
      parameters:
        - $ref: '#/components/parameters/LibraryFileId'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryFileIngestionResultResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '409':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/library/scans:
    post:
      tags: [Library]
      operationId: createWebLibraryScan
      summary: 创建一次后台原件库扫描
      description: 扫描只登记和核对原件，不创建 Paper、入库任务、chunk 或向量。
      parameters:
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '202':
          $ref: '#/components/responses/LibraryScanAcceptedResponse'
        '409':
          description: 已有活动扫描；错误 code 固定为 LIBRARY_SCAN_ACTIVE。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultError'
              example:
                code: LIBRARY_SCAN_ACTIVE
                message: 原件库扫描正在进行。
                requestId: req-library-scan-001
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/library/scans/{scanId}:
    get:
      tags: [Library]
      operationId: getWebLibraryScan
      summary: 获取原件库扫描任务
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryScanResultResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/library/scans/{scanId}/items:
    get:
      tags: [Library]
      operationId: listWebLibraryScanItems
      summary: 分页获取扫描文件结果
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/ScanItemsOffset'
        - $ref: '#/components/parameters/ScanItemsLimit'
        - $ref: '#/components/parameters/ScanItemOutcomeFilter'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/LibraryScanItemsResultResponse'
        '400':
          $ref: '#/components/responses/JsonErrorResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/papers:
    post:
      tags: [Papers]
      operationId: uploadWebPaper
      summary: 上传一篇文本型 PDF
      deprecated: true
      description: >-
        兼容性入口；新客户端应依次调用 library/files 上传原件和 ingestion 手动入库。
        multipart 请求必须且只能包含一个名为 file 的 PDF，最大 50 MB、500 页。
        Java 不保存文件，只把请求转发给 Agent。
      parameters:
        - $ref: '#/components/parameters/OptionalRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传已接收，或返回 SHA-256 相同的既有论文。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperUploadResult'
              example:
                code: SUCCESS
                message: Success.
                requestId: req-demo-001
                data:
                  paper:
                    paperId: paper-demo-001
                    title: Synthetic Bilingual Research
                    authors: [Demo Author]
                    publicationYear: 2026
                    fileName: synthetic-demo.pdf
                    fileSizeBytes: 4096
                    libraryRelativePath: synthetic-demo.pdf
                    sourceStatus: AVAILABLE
                    status: PROCESSING
                    searchable: false
                    pageCount: null
                    createdAt: '2026-01-01T00:00:00Z'
                    updatedAt: '2026-01-01T00:00:00Z'
                    currentIngestion:
                      jobId: job-demo-001
                      status: QUEUED
                      stage: QUEUED
                      attempt: 0
                      maxAttempts: 3
                      canRetry: false
                      failure: null
                  ingestionJob:
                    jobId: job-demo-001
                    paperId: paper-demo-001
                    status: QUEUED
                    stage: QUEUED
                    attempt: 0
                    maxAttempts: 3
                    canRetry: false
                    failure: null
                    createdAt: '2026-01-01T00:00:00Z'
                    startedAt: null
                    completedAt: null
                  duplicate: false
        '400':
          $ref: '#/components/responses/JsonErrorResponse'
        '413':
          $ref: '#/components/responses/JsonErrorResponse'
        '415':
          $ref: '#/components/responses/JsonErrorResponse'
        '422':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
    get:
      tags: [Papers]
      operationId: listWebPapers
      summary: 列出论文和当前入库状态
      parameters:
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          description: 论文列表，按创建时间倒序。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperListResult'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/papers/{paperId}:
    get:
      tags: [Papers]
      operationId: getWebPaper
      summary: 获取论文详情
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PaperResultResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/papers/{paperId}/exclusion:
    post:
      tags: [Papers]
      operationId: excludeWebPaper
      summary: 将论文移出知识库但保留原件
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PaperResultResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '409':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
    delete:
      tags: [Papers]
      operationId: restoreWebPaper
      summary: 重新加入原件可用的已排除论文
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/PaperResultResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '409':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/papers/{paperId}/file:
    get:
      tags: [Papers]
      operationId: getWebPaperFile
      summary: 预览或按 Range 读取 PDF
      description: >-
        Java 必须保留下游的 Range、Content-Range、Content-Length、Content-Type、
        Accept-Ranges 与 ETag 语义。成功与错误均不使用 Result<T>。
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - $ref: '#/components/parameters/OptionalRequestId'
        - $ref: '#/components/parameters/OptionalRange'
      responses:
        '200':
          $ref: '#/components/responses/PdfFile'
        '206':
          $ref: '#/components/responses/PdfPartialFile'
        '400':
          $ref: '#/components/responses/FileErrorResponse'
        '404':
          $ref: '#/components/responses/FileErrorResponse'
        '416':
          $ref: '#/components/responses/FileErrorResponse'
        '500':
          $ref: '#/components/responses/FileErrorResponse'
        '502':
          $ref: '#/components/responses/FileErrorResponse'
        '504':
          $ref: '#/components/responses/FileErrorResponse'
  /api/v1/ingestion-jobs/{jobId}:
    get:
      tags: [Ingestion jobs]
      operationId: getWebIngestionJob
      summary: 获取入库任务状态和阶段
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/IngestionJobResultResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/ingestion-jobs/{jobId}/retry:
    post:
      tags: [Ingestion jobs]
      operationId: retryWebIngestionJob
      summary: 重试一个可重试的失败任务
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/OptionalRequestId'
      responses:
        '200':
          $ref: '#/components/responses/IngestionJobResultResponse'
        '404':
          $ref: '#/components/responses/JsonErrorResponse'
        '409':
          $ref: '#/components/responses/JsonErrorResponse'
        '500':
          $ref: '#/components/responses/JsonErrorResponse'
        '502':
          $ref: '#/components/responses/JsonErrorResponse'
        '504':
          $ref: '#/components/responses/JsonErrorResponse'
  /api/v1/conversations/{conversationId}/messages/stream:
    post:
      tags: [Conversations]
      operationId: streamWebConversationMessage
      summary: 流式生成助手消息
      description: >-
        Java 接收调用方的 X-Request-Id；缺失时生成并转发。HTTP 200 表示流已建立；
        建流前非 2xx 使用 StreamOpenError，建流后只由 run.failed 表达失败。
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/OptionalRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStreamRequest'
            examples:
              defaultKnowledgeBase:
                value:
                  content: 论文中的核心实验结论是什么？
                  paperIds: []
              selectedPaper:
                value:
                  content: 第二页报告了什么结果？
                  paperIds: [paper-demo-001]
      responses:
        '200':
          $ref: '#/components/responses/SseStream'
        '400':
          $ref: '#/components/responses/BadStreamRequest'
        '500':
          $ref: '#/components/responses/InternalStreamError'
        '502':
          $ref: '#/components/responses/AgentUnavailableStreamError'
        '504':
          $ref: '#/components/responses/AgentTimeoutStreamError'
        default:
          $ref: '#/components/responses/UnexpectedStreamOpenError'
      x-sse-event-schema:
        $ref: '#/components/schemas/SseEvent'
      x-sse-contract: ../sse/v1/README.md
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PaperId:
      name: paperId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    LibraryFileId:
      name: libraryFileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ScanItemsOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ScanItemsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    ScanItemOutcomeFilter:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LibraryScanItemOutcome'
    LibraryFilesOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    LibraryFilesLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    OptionalRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 可选；Java 缺失时生成，并用于响应头、错误体和下游请求。
      schema:
        $ref: '#/components/schemas/Identifier'
    OptionalRange:
      name: Range
      in: header
      required: false
      description: 单一 HTTP bytes range；不支持 multipart ranges。
      schema:
        type: string
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
        example: bytes=0-1023
  headers:
    XRequestId:
      description: Java 接收或生成的有效请求追踪标识。
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    CacheControl:
      description: SSE 响应不得缓存。
      required: true
      schema:
        type: string
        const: no-cache
    AcceptRanges:
      description: PDF 支持 bytes Range。
      required: true
      schema:
        type: string
        const: bytes
    ContentLength:
      description: 当前响应体字节数。
      required: true
      schema:
        type: integer
        minimum: 0
    ContentRange:
      description: 206 响应覆盖的字节范围和完整文件大小。
      required: true
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    ETag:
      description: 基于 PDF SHA-256 的强 ETag。
      required: true
      schema:
        type: string
        minLength: 3
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
    PaperStatus:
      type: string
      enum: [PROCESSING, READY, FAILED, EXCLUDED]
    PaperSourceStatus:
      type: string
      enum: [AVAILABLE, MISSING, REPLACED]
    LibraryFileKnowledgeStatus:
      type: string
      description: 原件与默认知识库的对应状态；扫描和原件上传只能产生 NOT_INGESTED。
      enum: [NOT_INGESTED, PROCESSING, READY, FAILED, EXCLUDED]
    LibraryScanStatus:
      type: string
      description: 单个文件失败时任务仍可 SUCCEEDED，并通过 failedCount 和扫描项报告部分失败。
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
    LibraryScanItemOutcome:
      type: string
      description: 每个被发现路径的独立处理结果；REGISTERED 只表示新增 LibraryFile，不表示入库。
      enum: [REGISTERED, UNCHANGED, MOVED, DUPLICATE, EXCLUDED, SKIPPED, FAILED]
    IngestionJobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
    IngestionStage:
      type: string
      enum: [QUEUED, PARSING, CHUNKING, EMBEDDING, INDEXING, COMPLETED, FAILED]
    IngestionFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        retryable:
          type: boolean
    IngestionSummary:
      type: object
      additionalProperties: false
      required: [jobId, status, stage, attempt, maxAttempts, canRetry, failure]
      properties:
        jobId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/IngestionJobStatus'
        stage:
          $ref: '#/components/schemas/IngestionStage'
        attempt:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        canRetry:
          type: boolean
        failure:
          oneOf:
            - $ref: '#/components/schemas/IngestionFailure'
            - type: 'null'
    Paper:
      type: object
      additionalProperties: false
      required:
        - paperId
        - title
        - authors
        - publicationYear
        - fileName
        - fileSizeBytes
        - libraryRelativePath
        - sourceStatus
        - status
        - searchable
        - pageCount
        - createdAt
        - updatedAt
        - currentIngestion
      properties:
        paperId:
          $ref: '#/components/schemas/Identifier'
        title:
          type: string
          minLength: 1
          maxLength: 1024
        authors:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        publicationYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 9999
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 52428800
        libraryRelativePath:
          type: string
          minLength: 1
          maxLength: 2048
          description: 相对 originals 目录的正斜杠路径；不得是绝对路径或包含路径穿越。
        sourceStatus:
          $ref: '#/components/schemas/PaperSourceStatus'
        status:
          $ref: '#/components/schemas/PaperStatus'
        searchable:
          type: boolean
          description: 仅 READY 且 AVAILABLE 且未排除时为 true。
        pageCount:
          type: [integer, 'null']
          minimum: 1
          maximum: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentIngestion:
          $ref: '#/components/schemas/IngestionSummary'
    IngestionJob:
      type: object
      additionalProperties: false
      required:
        - jobId
        - paperId
        - status
        - stage
        - attempt
        - maxAttempts
        - canRetry
        - failure
        - createdAt
        - startedAt
        - completedAt
      properties:
        jobId:
          $ref: '#/components/schemas/Identifier'
        paperId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/IngestionJobStatus'
        stage:
          $ref: '#/components/schemas/IngestionStage'
        attempt:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        canRetry:
          type: boolean
        failure:
          oneOf:
            - $ref: '#/components/schemas/IngestionFailure'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    PaperUploadData:
      type: object
      additionalProperties: false
      required: [paper, ingestionJob, duplicate]
      properties:
        paper:
          $ref: '#/components/schemas/Paper'
        ingestionJob:
          $ref: '#/components/schemas/IngestionJob'
        duplicate:
          type: boolean
    PaperListData:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Paper'
        total:
          type: integer
          minimum: 0
    LibraryFile:
      type: object
      additionalProperties: false
      required:
        - libraryFileId
        - relativePath
        - fileName
        - fileSizeBytes
        - sha256
        - sourceStatus
        - knowledgeStatus
        - paperId
        - paperTitle
        - searchable
        - currentIngestion
        - discoveredAt
        - lastSeenAt
        - updatedAt
      properties:
        libraryFileId:
          $ref: '#/components/schemas/Identifier'
        relativePath:
          type: string
          minLength: 1
          maxLength: 2048
          description: 相对 originals 目录的正斜杠路径；不得是绝对路径或包含路径穿越。
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 52428800
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sourceStatus:
          $ref: '#/components/schemas/PaperSourceStatus'
        knowledgeStatus:
          $ref: '#/components/schemas/LibraryFileKnowledgeStatus'
        paperId:
          description: NOT_INGESTED 时必须为 null；其余知识库状态必须关联 Paper。
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        paperTitle:
          type: [string, 'null']
          minLength: 1
          maxLength: 1024
        searchable:
          type: boolean
          description: 仅 knowledgeStatus=READY 且 sourceStatus=AVAILABLE 时为 true。
        currentIngestion:
          description: NOT_INGESTED 时必须为 null；关联 Paper 后返回其当前入库任务摘要。
          oneOf:
            - $ref: '#/components/schemas/IngestionSummary'
            - type: 'null'
        discoveredAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LibraryFilesPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryFile'
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
    LibraryFileUploadData:
      type: object
      additionalProperties: false
      required: [libraryFile, duplicate]
      properties:
        libraryFile:
          $ref: '#/components/schemas/LibraryFile'
        duplicate:
          type: boolean
          description: true 表示相同 SHA-256 原件已经登记，未重复落盘。
    LibraryFileIngestionData:
      type: object
      additionalProperties: false
      required: [libraryFile, paper, ingestionJob, duplicate]
      properties:
        libraryFile:
          $ref: '#/components/schemas/LibraryFile'
        paper:
          $ref: '#/components/schemas/Paper'
        ingestionJob:
          $ref: '#/components/schemas/IngestionJob'
        duplicate:
          type: boolean
          description: true 表示相同 SHA-256 已有关联 Paper，未创建第二篇论文或向量。
    LibraryScanFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
    LibraryScan:
      type: object
      additionalProperties: false
      required:
        - scanId
        - status
        - discoveredCount
        - registeredCount
        - unchangedCount
        - duplicateCount
        - excludedCount
        - skippedCount
        - failedCount
        - createdAt
        - startedAt
        - completedAt
        - failure
      properties:
        scanId:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/LibraryScanStatus'
        discoveredCount: { type: integer, minimum: 0 }
        registeredCount:
          type: integer
          minimum: 0
          description: 本次新增登记的原件数量；登记原件不会自动创建 Paper、入库任务或向量。
        unchangedCount: { type: integer, minimum: 0 }
        duplicateCount: { type: integer, minimum: 0 }
        excludedCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        failure:
          oneOf:
            - $ref: '#/components/schemas/LibraryScanFailure'
            - type: 'null'
    LibraryInfo:
      type: object
      additionalProperties: false
      required: [rootPath, supportedExtensions, scanInProgress, latestScan]
      properties:
        rootPath:
          type: string
          minLength: 1
          description: Agent 解析后的本机原件库绝对路径，仅用于本地用户管理文件。
        supportedExtensions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: ['.pdf']
        scanInProgress:
          type: boolean
        latestScan:
          oneOf:
            - $ref: '#/components/schemas/LibraryScan'
            - type: 'null'
    LibraryScanItem:
      type: object
      additionalProperties: false
      required: [relativePath, outcome, libraryFileId, paperId, code, message]
      properties:
        relativePath:
          type: string
          minLength: 1
          maxLength: 2048
        outcome:
          $ref: '#/components/schemas/LibraryScanItemOutcome'
        libraryFileId:
          description: 成功对应到原件记录时返回；SKIPPED 或无法登记的 FAILED 项可以为 null。
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        paperId:
          description: 原件尚未手动录入知识库时为 null；扫描本身不得创建 Paper。
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        code:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        message:
          type: [string, 'null']
          minLength: 1
          maxLength: 2048
    LibraryScanItemsPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryScanItem'
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
    SuccessResultBase:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          const: SUCCESS
        message:
          type: string
          minLength: 1
        requestId:
          $ref: '#/components/schemas/Identifier'
    PaperUploadResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PaperUploadData'
      unevaluatedProperties: false
    PaperListResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PaperListData'
      unevaluatedProperties: false
    PaperResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Paper'
      unevaluatedProperties: false
    IngestionJobResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/IngestionJob'
      unevaluatedProperties: false
    LibraryResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LibraryInfo'
      unevaluatedProperties: false
    LibraryFilesResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LibraryFilesPage'
      unevaluatedProperties: false
    LibraryFileUploadResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LibraryFileUploadData'
      unevaluatedProperties: false
    LibraryFileIngestionResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LibraryFileIngestionData'
      unevaluatedProperties: false
    LibraryScanResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LibraryScan'
      unevaluatedProperties: false
    LibraryScanItemsResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResultBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LibraryScanItemsPage'
      unevaluatedProperties: false
    ResultError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          not:
            const: SUCCESS
        message:
          type: string
          minLength: 1
          maxLength: 2048
        requestId:
          $ref: '#/components/schemas/Identifier'
    FileError:
      type: object
      additionalProperties: false
      required: [schemaVersion, code, message, requestId, retryable]
      properties:
        schemaVersion:
          const: '1.0'
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        requestId:
          $ref: '#/components/schemas/Identifier'
        retryable:
          type: boolean
    ChatStreamRequest:
      type: object
      additionalProperties: false
      required: [content, paperIds]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 16000
        paperIds:
          type: array
          uniqueItems: true
          maxItems: 100
          description: 空数组表示检索默认全库；非空数组严格限定到给定论文。
          items:
            $ref: '#/components/schemas/Identifier'
    SseEvent:
      $ref: ../sse/v1/sse-event.schema.json
    StreamOpenError:
      $ref: ../sse/v1/stream-open-error.schema.json
  responses:
    LibraryResultResponse:
      description: 本地论文原件库状态 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryResult'
          example:
            code: SUCCESS
            message: Success.
            requestId: req-library-001
            data:
              rootPath: 'D:/AIResearcher/.private/paper-library'
              supportedExtensions: ['.pdf']
              scanInProgress: false
              latestScan: null
    LibraryFilesResultResponse:
      description: 分页原件与知识库对应状态 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryFilesResult'
          example:
            code: SUCCESS
            message: Success.
            requestId: req-library-files-001
            data:
              items:
                - libraryFileId: library-file-demo-001
                  relativePath: uploads/synthetic-demo.pdf
                  fileName: synthetic-demo.pdf
                  fileSizeBytes: 4096
                  sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                  sourceStatus: AVAILABLE
                  knowledgeStatus: NOT_INGESTED
                  paperId: null
                  paperTitle: null
                  searchable: false
                  currentIngestion: null
                  discoveredAt: '2026-08-29T00:00:00Z'
                  lastSeenAt: '2026-08-29T00:00:00Z'
                  updatedAt: '2026-08-29T00:00:00Z'
              total: 1
              offset: 0
              limit: 100
    LibraryFileUploadResultResponse:
      description: PDF 原件已登记但未创建 Paper 或入库任务的 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryFileUploadResult'
          example:
            code: SUCCESS
            message: Success.
            requestId: req-library-upload-001
            data:
              libraryFile:
                libraryFileId: library-file-demo-001
                relativePath: uploads/synthetic-demo.pdf
                fileName: synthetic-demo.pdf
                fileSizeBytes: 4096
                sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                sourceStatus: AVAILABLE
                knowledgeStatus: NOT_INGESTED
                paperId: null
                paperTitle: null
                searchable: false
                currentIngestion: null
                discoveredAt: '2026-08-29T00:00:00Z'
                lastSeenAt: '2026-08-29T00:00:00Z'
                updatedAt: '2026-08-29T00:00:00Z'
              duplicate: false
    LibraryFileIngestionResultResponse:
      description: 原件已关联 Paper 和当前入库任务的 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryFileIngestionResult'
    LibraryScanAcceptedResponse:
      description: 原件库扫描任务已排队 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryScanResult'
          example:
            code: SUCCESS
            message: Success.
            requestId: req-library-scan-001
            data:
              scanId: scan-demo-001
              status: QUEUED
              discoveredCount: 0
              registeredCount: 0
              unchangedCount: 0
              duplicateCount: 0
              excludedCount: 0
              skippedCount: 0
              failedCount: 0
              createdAt: '2026-08-29T00:00:00Z'
              startedAt: null
              completedAt: null
              failure: null
    LibraryScanResultResponse:
      description: 原件库扫描任务详情 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryScanResult'
    LibraryScanItemsResultResponse:
      description: 分页扫描文件结果 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryScanItemsResult'
          example:
            code: SUCCESS
            message: Success.
            requestId: req-library-scan-items-001
            data:
              items:
                - relativePath: topic/synthetic-demo.pdf
                  outcome: REGISTERED
                  libraryFileId: library-file-demo-001
                  paperId: null
                  code: null
                  message: null
              total: 1
              offset: 0
              limit: 100
    PaperResultResponse:
      description: 论文详情 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaperResult'
    IngestionJobResultResponse:
      description: 入库任务 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestionJobResult'
    JsonErrorResponse:
      description: 普通 JSON API 的稳定 Result 错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultError'
          example:
            code: PAPER_NOT_FOUND
            message: 未找到指定论文。
            requestId: req-demo-error-001
    FileErrorResponse:
      description: PDF 端点错误；与文件成功响应一样不使用 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileError'
          example:
            schemaVersion: '1.0'
            code: RANGE_NOT_SATISFIABLE
            message: 请求的 PDF 字节范围无效。
            requestId: req-demo-error-001
            retryable: false
    PdfFile:
      description: 完整 PDF；不使用 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    PdfPartialFile:
      description: 单一 Range 的 PDF 字节片段；不使用 Result。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Content-Range:
          $ref: '#/components/headers/ContentRange'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    SseStream:
      description: >-
        Java 原样转发共享 SSE v1 事件名、ID 和 envelope；不使用 Result，也不发送
        隐藏推理。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        text/event-stream:
          schema:
            type: string
          examples:
            completed:
              externalValue: ../sse/v1/examples/streams/run-completed.sse
            failed:
              externalValue: ../sse/v1/examples/streams/run-failed.sse
    BadStreamRequest:
      description: 请求无效，流尚未建立。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
          examples:
            invalidRequest:
              externalValue: ../sse/v1/examples/stream-open-error.json
    InternalStreamError:
      description: Java 在建流前发生内部错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
    AgentUnavailableStreamError:
      description: Java 在建流前无法连接 Agent。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
    AgentTimeoutStreamError:
      description: Java 等待 Agent 建流超时。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
    UnexpectedStreamOpenError:
      description: 其他建流前非 2xx 错误。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamOpenError'
